# Example configuration file for rusnapshot
# These are all the current available options. All of them are optional, and options
# given on the command line take precedence over the values in this file.

# Snapshots directory
dest_dir = "/.snapshots"
# Directory to be snapshot-ed
source_dir = "/"
# SQLite database file PATH where snapshots metadata will be stored. Created if not exists
database_file = "/.snapshots/rusnapshot.db"
# Prefix for the snapshots, they will be saved in the format prefix-$current_date
snapshot_prefix = "root"
# Snapshots identifier. Usually given on the command line (--kind) so the same file
# can be used for daily, weekly and monthly snapshots.
snapshot_kind = "weekly"
# Last snapshots to keep when running with --clean. Only the snapshots with the same
# prefix, kind, machine and ro/rw mode are considered.
keep_only = 3
# SQLite busy timeout in milliseconds
timeout = 10000
# Machine name to be used in the snapshots metadata. Defaults to the hostname.
machine = "Oribos"
